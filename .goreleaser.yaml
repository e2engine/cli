version: 2

project_name: e2engine

builds:
  - main: ./cmd/cli
    binary: e2engine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/e2engine/cli/internal/command/version.version={{.Version}}
        -X github.com/e2engine/cli/internal/command/version.buildTime={{.Date}}
        -X github.com/e2engine/cli/internal/command/version.gitCommit={{.Commit}}
        -X github.com/e2engine/cli/internal/command/version.gitTreeState=clean

dockers_v2:
  - images:
      - ghcr.io/e2engine/cli
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
    wrap_in_directory: true

nfpms:
  - package_name: e2engine
    vendor: E2Engine
    homepage: "https://github.com/e2engine/cli"
    maintainer: "Yaroslav Grebnov <grebnov@gmail.com>"
    description: "Declarative end-to-end testing and service mocking for distributed systems."
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^vendor:"
      - "^tests:"

homebrew_casks:
  - name: e2engine
    repository:
      owner: e2engine
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: Yaroslav Grebnov
      email: grebnov@gmail.com
    homepage: "https://github.com/e2engine/cli"
    description: "Declarative end-to-end testing and service mocking for distributed systems."
    license: "Apache-2.0"
    skip_upload: auto

scoops:
  - name: e2engine
    repository:
      owner: e2engine
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: "https://github.com/e2engine/cli"
    description: "Declarative end-to-end testing and service mocking for distributed systems."
    license: "Apache-2.0"