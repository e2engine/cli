name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify
        run: make verify

      - name: Build CLI
        run: make build-cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: make build-image

  e2e:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CLI
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout E2Engine tests
        uses: actions/checkout@v7
        with:
          repository: e2engine/tests
          ref: stable
          path: e2engine-tests

      - name: Run E2E tests
        run: |
          make -C e2engine-tests test-cli test-docker \
            CLI_REPO="${{ github.workspace }}/.git" \
            CLI_REF="${{ github.sha }}"